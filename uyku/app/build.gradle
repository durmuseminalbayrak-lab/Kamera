plugins {
    id 'com.android.application'
}

def runNo = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'com.durmuseminalbayrak.uyku'
    compileSdk 34

    defaultConfig {
        applicationId 'com.durmuseminalbayrak.uyku'
        minSdk 29
        targetSdk 34
        versionCode runNo
        versionName "1.${runNo}"
    }

    signingConfigs {
        release {
            // Kişisel uygulama: güncellemelerin aynı imzayla kurulabilmesi için sabit anahtar
            storeFile file('uyku.keystore')
            storeType 'pkcs12'
            storePassword 'kamera-imza'
            keyAlias 'kamera'
            keyPassword 'kamera-imza'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
