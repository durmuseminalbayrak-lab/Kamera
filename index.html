<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- GÜVENLİK: default-src 'none' => bu sayfa internete HİÇBİR veri gönderemez. Görüntüler telefonda kalır. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' blob: data:; media-src blob: mediastream:; manifest-src 'self'; worker-src 'self';">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Kamera</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #view { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  #stage { position: absolute; pointer-events: none; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  #grid { position: absolute; inset: 0; display: none;
    background-image: linear-gradient(to right, transparent 33.2%, rgba(255,255,255,.35) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.35) 66.6%, transparent 66.8%),
                      linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.35) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.35) 66.6%, transparent 66.8%); }
  #horizon { position: absolute; left: 18%; right: 18%; top: 50%; height: 0; display: none; }
  #horizon div { position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: rgba(255,255,255,.75); box-shadow: 0 0 3px #000; }
  #horizon.ok div { background: #5df58a; }
  #bubbleWrap { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid rgba(255,255,255,.6); border-radius: 50%; display: none; }
  #bubbleWrap::after { content: ''; position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px; border: 1px solid rgba(255,255,255,.6); border-radius: 50%; }
  #bubble { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; border-radius: 50%; background: #ffd54a; box-shadow: 0 0 4px #000; }
  #bubbleWrap.ok { border-color: #5df58a; } #bubbleWrap.ok #bubble { background: #5df58a; }
  #thermalTag { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 11px; background: rgba(0,0,0,.65); padding: 2px 8px; border-radius: 8px; display: none; white-space: nowrap; }
  #hist { position: absolute; right: 10px; top: 64px; width: 128px; height: 64px; background: rgba(0,0,0,.5); border-radius: 6px; display: none; pointer-events: none; }
  #ring { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border: 2px solid #ffd54a; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; transform: scale(1.4); }
  #ring.on { opacity: 1; transform: scale(1); }
  #top { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 6px; justify-content: space-between; padding: max(10px, env(safe-area-inset-top)) 10px 8px; background: linear-gradient(rgba(0,0,0,.65), transparent); z-index: 2; font-size: 14px; }
  #steady { position: absolute; left: 10px; top: 64px; display: none; align-items: center; gap: 6px; font-size: 12px; background: rgba(0,0,0,.5); padding: 4px 9px; border-radius: 12px; pointer-events: none; }
  #steady i { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; }
  #afBadge { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); display: none; z-index: 2; background: rgba(255,213,74,.9); color: #000; font-size: 13px; min-height: 34px; padding: 6px 12px; }
  #busy { position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%); background: rgba(0,0,0,.75); padding: 12px 20px; border-radius: 14px; font-size: 20px; display: none; z-index: 3; text-align: center; pointer-events: none; }
  #info { position: absolute; left: 10px; bottom: 8px; font-size: 11px; opacity: .8; text-shadow: 0 0 4px #000; pointer-events: none; max-width: 70%; }
  #rec { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: #d32f2f; padding: 3px 12px; border-radius: 12px; font-size: 14px; display: none; }
  #toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(0,0,0,.8); padding: 8px 14px; border-radius: 10px; font-size: 14px; display: none; max-width: 90%; text-align: center; z-index: 9; white-space: pre-line; }
  #scanCard { position: absolute; left: 10px; right: 10px; bottom: 10px; background: rgba(20,20,20,.95); border: 1px solid rgba(255,255,255,.2); border-radius: 14px; padding: 12px; display: none; z-index: 3; }
  #scFmt { font-size: 12px; opacity: .7; }
  #scText { font-size: 16px; word-break: break-all; -webkit-user-select: text; user-select: text; max-height: 30vh; overflow: auto; margin: 6px 0 10px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  #bar { background: #000; padding: 8px 10px max(14px, env(safe-area-inset-bottom)); }
  #pro { display: none; flex-direction: column; gap: 4px; margin-bottom: 6px; font-size: 13px; }
  #pro .r { display: flex; align-items: center; gap: 8px; }
  #pro .r span { width: 84px; flex: none; }
  #pro .r input { flex: 1; min-width: 0; }
  #pro .r b { width: 74px; text-align: right; font-weight: 500; flex: none; }
  #zoomrow { display: none; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
  #zoomrow input { flex: 1; }
  #pdfbar { display: none; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; justify-content: center; }
  #modes { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: 8px; font-size: 14px; justify-content: safe center; }
  #modes::-webkit-scrollbar { display: none; }
  #modes span { opacity: .55; padding: 6px 9px; white-space: nowrap; }
  #modes span.sel { opacity: 1; color: #ffd54a; font-weight: 700; }
  #ctrl { display: flex; align-items: center; justify-content: space-between; }
  button { font: inherit; color: #fff; background: rgba(255,255,255,.14); border: 0; border-radius: 22px; padding: 9px 13px; min-width: 44px; min-height: 42px; }
  button.act { background: #ffd54a; color: #000; }
  button.pri { background: #ffd54a; color: #000; font-weight: 700; }
  #shutter { width: 72px; height: 72px; border-radius: 50%; background: #fff; border: 5px solid #000; box-shadow: 0 0 0 3px #fff; padding: 0; }
  #shutter.video { background: #d32f2f; }
  #shutter.scan { background: #4aa3ff; }
  #shutter.recording { border-radius: 14px; width: 60px; height: 60px; }
  #thumb { width: 52px; height: 52px; border-radius: 10px; background: #222 center/cover no-repeat; border: 1px solid rgba(255,255,255,.35); padding: 0; min-width: 0; font-size: 20px; }
  #start { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; z-index: 8; }
  #start button { background: #ffd54a; color: #000; font-weight: 700; padding: 14px 30px; font-size: 18px; }
  #err { color: #ff8a80; font-size: 14px; white-space: pre-wrap; text-align: center; }
  #panel { position: absolute; inset: 0; background: rgba(0,0,0,.92); z-index: 6; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82%; overflow: auto; background: #151515; border-radius: 18px 18px 0 0; z-index: 7; padding: 12px 16px max(16px, env(safe-area-inset-bottom)); display: none; }
  #sheetBack { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 7; display: none; }
  #sheet h3 { margin: 4px 0 6px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
  #sheet .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 15px; }
  #sheet .row small { display: block; opacity: .6; font-size: 12px; margin-top: 2px; }
  #sheet select { font: inherit; background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 6px; }
  .sw { position: relative; width: 46px; height: 26px; flex: none; }
  .sw input { opacity: 0; position: absolute; inset: 0; margin: 0; z-index: 1; }
  .sw i { position: absolute; inset: 0; border-radius: 13px; background: #444; transition: .2s; }
  .sw i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
  .sw input:checked + i { background: #ffd54a; }
  .sw input:checked + i::after { left: 23px; }
  #doc { position: absolute; inset: 0; background: #000; z-index: 5; display: none; flex-direction: column; }
  #docHd { padding: max(12px, env(safe-area-inset-top)) 12px 6px; font-size: 15px; text-align: center; opacity: .85; }
  #dwrap { flex: 1; min-height: 0; position: relative; }
  #dc { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #chips { display: none; gap: 6px; justify-content: center; padding: 6px; flex-wrap: wrap; }
  #docC, #docR { display: none; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 8px 10px max(12px, env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <video id="v" playsinline muted autoplay></video>
    <div id="stage">
      <canvas id="fx"></canvas>
      <div id="grid"></div>
      <div id="horizon"><div></div></div>
      <div id="bubbleWrap"><div id="bubble"></div></div>
      <div id="thermalTag">TERMAL EFEKT · gerçek sıcaklık değildir</div>
    </div>
    <canvas id="hist" width="128" height="64"></canvas>
    <div id="ring"></div>
    <div id="top">
      <button id="bFlash">Flaş: kapalı</button>
      <button id="bTimer">⏱ kapalı</button>
      <button id="bSet">⚙ Ayarlar</button>
    </div>
    <div id="steady"><i></i><span>Sabit</span></div>
    <button id="afBadge">AF kilitli ✕</button>
    <div id="rec">● 00:00</div>
    <div id="busy"></div>
    <div id="info"></div>
    <div id="toast"></div>
    <div id="scanCard">
      <div id="scFmt"></div>
      <div id="scText"></div>
      <div class="btns"><button id="scCopy">Kopyala</button><button id="scOpen">Bağlantıyı aç</button><button id="scClose">Kapat</button></div>
    </div>
  </div>
  <div id="bar">
    <div id="pro"></div>
    <div id="zoomrow"><span>Yakınlaştır</span><input id="zoom" type="range"><span id="zv">1x</span></div>
    <div id="pdfbar"><span>PDF: <b id="pdfN">0</b> sayfa</span><button id="pdfSave" class="pri">PDF kaydet</button><button id="pdfClear">Temizle</button></div>
    <div id="modes"></div>
    <div id="ctrl">
      <button id="thumb" aria-label="Son çekim"></button>
      <button id="shutter" aria-label="Çek"></button>
      <button id="bCam">Kamera</button>
    </div>
  </div>

  <div id="doc">
    <div id="docHd"></div>
    <div id="dwrap"><canvas id="dc"></canvas></div>
    <div id="chips">
      <button data-f="enh">Net renk</button><button data-f="bw">Siyah-beyaz</button><button data-f="gray">Gri</button><button data-f="orig">Orijinal</button>
    </div>
    <div id="docC"><button id="dAuto">Otomatik</button><button id="dFull">Tam kare</button><button id="dCancel">İptal</button><button id="dNext" class="pri">Devam →</button></div>
    <div id="docR"><button id="dRot">⟳ Döndür</button><button id="dBack">← Köşeler</button><button id="dJpg">JPG kaydet</button><button id="dPdf" class="pri">PDF'e ekle</button></div>
  </div>

  <div id="sheetBack"></div>
  <div id="sheet"><h3>Ayarlar <button id="sheetClose">Kapat</button></h3><div id="sheetBody"></div></div>

  <div id="start">
    <div style="font-size:22px;font-weight:700">Kamera</div>
    <div style="opacity:.8;max-width:420px;font-size:14px">Bu sayfa internete veri gönderemez. Görüntüler yalnızca telefonunuzda kalır. Başlamak için kamera iznini vermeniz gerekir.</div>
    <button id="go">Kamerayı aç</button>
    <div id="err"></div>
  </div>

  <div id="panel">
    <div id="pmedia" style="max-width:100%;text-align:center"></div>
    <div class="btns" style="justify-content:center">
      <button id="pSave">Kaydet</button>
      <button id="pShare">Paylaş / Galeriye</button>
      <button id="pClose">Kapat</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const video = $('v');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d', { willReadFrequently: true })]; };
  const toJpeg = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q || 0.92));

  // ================= AYARLAR =================
  const DEF = { afLock: true, refocus: false, grid: false, level: true, hist: false, zebra: false, thermal: false, voice: false, geo: false, steady: true, burst: 3, photoQ: 0, vres: 1 };
  const S = Object.assign({}, DEF);
  try { Object.assign(S, JSON.parse(localStorage.getItem('kamera-ayar') || '{}')); } catch (e) {}
  const saveS = () => { try { localStorage.setItem('kamera-ayar', JSON.stringify(S)); } catch (e) {} };

  let stream = null, track = null, imageCapture = null, devices = [], devIndex = 0, mode = 'photo', torchOn = false;
  let recorder = null, chunks = [], recTimer = null, recStart = 0, micStream = null;
  let last = null, busy = false, timerSec = 0, pages = [];
  const VRES = [{ w: 1280, h: 720, t: '720p' }, { w: 1920, h: 1080, t: '1080p' }, { w: 3840, h: 2160, t: '4K' }];
  const MODES = [['photo', 'FOTO'], ['doc', 'BELGE'], ['night', 'GECE'], ['pro', 'PRO'], ['video', 'VİDEO'], ['scan', 'BARKOD']];
  const PHOTO_MODES = ['photo', 'doc', 'night', 'pro'];

  function toast(msg, ms) {
    const t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast._h); toast._h = setTimeout(() => t.style.display = 'none', ms || 2200);
  }
  const showBusy = t => { const b = $('busy'); b.textContent = t; b.style.display = 'block'; };
  const hideBusy = () => { $('busy').style.display = 'none'; };
  const started = () => $('start').style.display === 'none';
  function stamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  // ================= SENSÖRLER =================
  const M = { rotAvg: 99, hasRot: false, ax: 0, ay: 9.8, az: 0, hasG: false, heading: null, pos: null };
  window.addEventListener('devicemotion', e => {
    const r = e.rotationRate;
    if (r && (r.alpha != null || r.beta != null || r.gamma != null)) {
      const m = Math.hypot(r.alpha || 0, r.beta || 0, r.gamma || 0);
      M.rotAvg = M.hasRot ? M.rotAvg * 0.75 + m * 0.25 : m; M.hasRot = true;
    }
    const g = e.accelerationIncludingGravity;
    if (g && g.x != null) {
      const k = M.hasG ? 0.25 : 1;
      M.ax += (g.x - M.ax) * k; M.ay += (g.y - M.ay) * k; M.az += (g.z - M.az) * k; M.hasG = true;
    }
  });
  window.addEventListener('deviceorientationabsolute', e => { if (e.alpha != null) M.heading = (360 - e.alpha) % 360; });

  let wasLevel = false;
  function sensorsTick() {
    const st = $('steady');
    if (S.steady && M.hasRot && started() && PHOTO_MODES.includes(mode)) {
      const v = M.rotAvg; st.style.display = 'flex';
      st.querySelector('i').style.background = v < 4 ? '#5df58a' : v < 10 ? '#ffd54a' : '#ff5252';
      st.querySelector('span').textContent = v < 4 ? 'Sabit' : 'Kıpırdıyor';
    } else st.style.display = 'none';

    const hz = $('horizon'), bw = $('bubbleWrap');
    if (!S.level || !M.hasG || !started() || mode === 'scan') { hz.style.display = 'none'; bw.style.display = 'none'; return; }
    const gN = Math.hypot(M.ax, M.ay, M.az) || 9.8;
    const flat = Math.abs(M.az) / gN > 0.8;
    if (flat) {
      hz.style.display = 'none';
      if (mode !== 'doc') { bw.style.display = 'none'; return; }
      bw.style.display = 'block';
      const tx = Math.atan2(M.ax, Math.abs(M.az)) * 57.2958, ty = Math.atan2(M.ay, Math.abs(M.az)) * 57.2958;
      $('bubble').style.transform = 'translate(' + clamp(tx * 2.5, -48, 48) + 'px,' + clamp(-ty * 2.5, -48, 48) + 'px)';
      const ok = Math.abs(tx) < 2 && Math.abs(ty) < 2;
      bw.classList.toggle('ok', ok); if (ok && !wasLevel) vibrate(15); wasLevel = ok;
    } else {
      bw.style.display = 'none'; hz.style.display = 'block';
      const th = Math.atan2(-M.ax, M.ay) * 57.2958 - ((screen.orientation && screen.orientation.angle) || 0);
      const d = th - Math.round(th / 90) * 90;
      hz.style.transform = 'rotate(' + (-d) + 'deg)';
      const ok = Math.abs(d) < 1; hz.classList.toggle('ok', ok); if (ok && !wasLevel) vibrate(10); wasLevel = ok;
    }
  }

  async function waitSteady(maxMs) {
    if (!S.steady || !M.hasRot) return;
    const t0 = performance.now(); let ok0 = 0;
    while (true) {
      const now = performance.now(), el = now - t0;
      if (el > maxMs) break;
      const thr = el < 1200 ? 4 : 7;
      if (M.rotAvg < thr) { if (!ok0) ok0 = now; if (now - ok0 >= 150) break; } else ok0 = 0;
      if (el > 250) showBusy('Sabit tutun…');
      await sleep(16);
    }
  }

  // ---- Konum ----
  let geoWatch = null;
  function geoOn() {
    if (!navigator.geolocation) { toast('Konum desteklenmiyor'); return; }
    if (geoWatch != null) return;
    geoWatch = navigator.geolocation.watchPosition(p => { M.pos = p.coords; }, e => {
      toast('Konum alınamadı: ' + (e.code === 1 ? 'izin verilmedi' : e.message), 3000);
      if (e.code === 1) { S.geo = false; saveS(); syncSheet(); geoOff(); }
    }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 });
  }
  function geoOff() { if (geoWatch != null) navigator.geolocation.clearWatch(geoWatch); geoWatch = null; M.pos = null; }

  // ---- Ekran açık kalsın ----
  let wake = null;
  async function requestWake() {
    try { if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
  }

  // ---- Sesle çekim ----
  let vMic = null, vCtx = null, vRaf = 0, vLast = 0;
  async function voiceOn() {
    if (vMic) return;
    try {
      vMic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      vCtx = new (window.AudioContext || window.webkitAudioContext)();
      try { await vCtx.resume(); } catch (e) {}
      const an = vCtx.createAnalyser(); an.fftSize = 1024;
      vCtx.createMediaStreamSource(vMic).connect(an);
      const buf = new Float32Array(an.fftSize); let floor = 0.02;
      const loop = () => {
        if (!vMic) return;
        an.getFloatTimeDomainData(buf);
        let pk = 0; for (let i = 0; i < buf.length; i++) { const a = Math.abs(buf[i]); if (a > pk) pk = a; }
        const now = performance.now();
        if (pk > 0.5 && pk > floor * 5 && now - vLast > 2500 && !busy && started() && $('doc').style.display !== 'flex' && PHOTO_MODES.includes(mode)) {
          vLast = now; toast('Ses algılandı', 900); $('shutter').click();
        }
        floor = floor * 0.97 + Math.min(pk, 0.3) * 0.03;
        vRaf = requestAnimationFrame(loop);
      };
      loop();
    } catch (e) { vMic = null; S.voice = false; saveS(); syncSheet(); toast('Mikrofon izni verilmedi'); }
  }
  function voiceOff() {
    cancelAnimationFrame(vRaf);
    if (vMic) vMic.getTracks().forEach(t => t.stop()); vMic = null;
    if (vCtx) { vCtx.close().catch(() => {}); vCtx = null; }
  }

  // ================= KAMERA =================
  async function listDevices() {
    const all = await navigator.mediaDevices.enumerateDevices();
    devices = all.filter(d => d.kind === 'videoinput');
    devices.sort((a, b) => (/front|ön/i.test(a.label) ? 1 : 0) - (/front|ön/i.test(b.label) ? 1 : 0));
  }
  function stopStream() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; track = null; imageCapture = null; torchOn = false;
    $('bFlash').textContent = 'Flaş: kapalı'; $('bFlash').classList.remove('act');
  }
  async function openCamera() {
    stopStream(); afLocked = false; $('afBadge').style.display = 'none';
    let w = 1920, h = 1080;
    if (mode === 'video') { w = VRES[S.vres].w; h = VRES[S.vres].h; }
    else if (mode === 'night') { w = 3840; h = 2160; }
    const base = { width: { ideal: w }, height: { ideal: h } };
    const vc = (devices[devIndex] && devices[devIndex].deviceId)
      ? Object.assign({ deviceId: { exact: devices[devIndex].deviceId } }, base)
      : Object.assign({ facingMode: { ideal: 'environment' } }, base);
    stream = await navigator.mediaDevices.getUserMedia({ video: vc, audio: false });
    track = stream.getVideoTracks()[0];
    video.srcObject = stream;
    try { await video.play(); } catch (e) {}
    await listDevices();

    const poly = (pts, sx, sy, col, fill) => {
      if (!pts || pts.length < 3) return;
      ctx.beginPath(); pts.forEach((p, i) => { const X = p[0] * sx, Y = p[1] * sy; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath();
      ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 3 * dpr; ctx.strokeStyle = col; ctx.stroke();
    };
    if (mode === 'doc' && docLive) poly(docLive, fx.width, fx.height, '#5df58a', 'rgba(93,245,138,.15)');
    if (mode === 'scan') scanBoxes.forEach(b => poly(b.map(p => [p.x, p.y]), fx.width / vw, fx.height / vh, '#4aa3ff', 'rgba(74,163,255,.2)'));
  }

  // ================= BELGE DÜZENLEYİCİ =================
  const D = { src: null, w: 0, h: 0, quad: null, auto: null, stage: 'c', warp: null, out: null, filter: 'enh', drag: -1, off: [0, 0], view: null };
  const docOpen = () => $('doc').style.display === 'flex';
  function fullQuad() { const m = 0.04; return [[D.w * m, D.h * m], [D.w * (1 - m), D.h * m], [D.w * (1 - m), D.h * (1 - m)], [D.w * m, D.h * (1 - m)]]; }
  function autoQuad(c) {
    const sw = 480, sh = Math.round(480 * c.height / c.width), [s, sx] = mk(sw, sh); sx.drawImage(c, 0, 0, sw, sh);
    const q = detectDoc(toGray(sx.getImageData(0, 0, sw, sh).data, sw * sh), sw, sh);
    return q ? q.map(p => [p[0] * c.width, p[1] * c.height]) : null;
  }
  async function openDoc(r) {
    showBusy('Hazırlanıyor…');
    const bm = await decodeCapped(r.blob, 4096), [c, x] = mk(bm.width, bm.height); x.drawImage(bm, 0, 0); bm.close();
    D.src = c; D.w = c.width; D.h = c.height; D.auto = autoQuad(c); D.quad = D.auto || fullQuad();
    D.stage = 'c'; D.filter = 'enh'; D.warp = D.out = null;
    $('doc').style.display = 'flex'; hideBusy(); docUI();
    if (!D.auto) toast('Kenarlar bulunamadı, köşeleri elle ayarlayın', 3000);
    requestAnimationFrame(drawDoc);
  }
  function closeDoc() { $('doc').style.display = 'none'; D.src = D.warp = D.out = null; }
  function docUI() {
    const c = D.stage === 'c';
    $('docHd').textContent = c ? 'Köşeleri belgenin kenarlarına sürükleyin' : 'Filtre seçin ve kaydedin';
    $('docC').style.display = c ? 'flex' : 'none'; $('docR').style.display = c ? 'none' : 'flex'; $('chips').style.display = c ? 'none' : 'flex';
    $('chips').querySelectorAll('button').forEach(b => b.classList.toggle('act', b.dataset.f === D.filter));
  }
  function drawDoc() {
    const cv = $('dc'), dpr = Math.min(window.devicePixelRatio || 1, 2), W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
    if (!W || !H) return;
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    const x = cv.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
    const img = D.stage === 'c' ? D.src : D.out; if (!img) return;
    const pad = (D.stage === 'c' ? 28 : 8) * dpr, k = Math.min((W - 2 * pad) / img.width, (H - 2 * pad) / img.height);
    const ox = (W - img.width * k) / 2, oy = (H - img.height * k) / 2; D.view = { k, ox, oy, dpr };
    x.imageSmoothingQuality = 'high'; x.drawImage(img, ox, oy, img.width * k, img.height * k);
    if (D.stage !== 'c') return;
    const P = D.quad.map(p => [ox + p[0] * k, oy + p[1] * k]);
    x.beginPath(); P.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath();
    x.fillStyle = 'rgba(93,245,138,.15)'; x.fill(); x.lineWidth = 2.5 * dpr; x.strokeStyle = '#5df58a'; x.stroke();
    P.forEach((p, i) => { x.beginPath(); x.arc(p[0], p[1], (i === D.drag ? 18 : 13) * dpr, 0, 7); x.fillStyle = 'rgba(255,213,74,.35)'; x.fill(); x.lineWidth = 2 * dpr; x.strokeStyle = '#ffd54a'; x.stroke(); });
    if (D.drag >= 0) { // büyüteç
      const q = D.quad[D.drag], R = 60 * dpr, zoom = 2.5, mx = P[D.drag][0] < W / 2 ? W - R - 12 * dpr : R + 12 * dpr, my = R + 12 * dpr, sz = 2 * R / (k * zoom);
      x.save(); x.beginPath(); x.arc(mx, my, R, 0, 7); x.clip(); x.fillStyle = '#000'; x.fillRect(mx - R, my - R, 2 * R, 2 * R);
      x.drawImage(D.src, q[0] - sz / 2, q[1] - sz / 2, sz, sz, mx - R, my - R, 2 * R, 2 * R); x.restore();
      x.beginPath(); x.arc(mx, my, R, 0, 7); x.strokeStyle = '#fff'; x.lineWidth = 2 * dpr; x.stroke();
      x.beginPath(); x.moveTo(mx - 10 * dpr, my); x.lineTo(mx + 10 * dpr, my); x.moveTo(mx, my - 10 * dpr); x.lineTo(mx, my + 10 * dpr); x.strokeStyle = '#5df58a'; x.stroke();
    }
  }
  const dc = $('dc');
  const toImg = e => { const r = dc.getBoundingClientRect(), v = D.view, X = (e.clientX - r.left) * v.dpr, Y = (e.clientY - r.top) * v.dpr; return [(X - v.ox) / v.k, (Y - v.oy) / v.k]; };
  dc.addEventListener('pointerdown', e => {
    if (D.stage !== 'c' || !D.view) return;
    const p = toImg(e); let bi = -1, bdist = 1e9;
    D.quad.forEach((q, i) => { const d = Math.hypot(q[0] - p[0], q[1] - p[1]) * D.view.k / D.view.dpr; if (d < bdist) { bdist = d; bi = i; } });
    if (bdist < 48) { D.drag = bi; D.off = [D.quad[bi][0] - p[0], D.quad[bi][1] - p[1]]; dc.setPointerCapture(e.pointerId); drawDoc(); }
  });
  dc.addEventListener('pointermove', e => { if (D.drag < 0) return; const p = toImg(e); D.quad[D.drag] = [clamp(p[0] + D.off[0], 0, D.w), clamp(p[1] + D.off[1], 0, D.h)]; drawDoc(); });
  const endDrag = () => { if (D.drag >= 0) { D.drag = -1; drawDoc(); } };
  dc.addEventListener('pointerup', endDrag); dc.addEventListener('pointercancel', endDrag);

  function applyFilter() {
    const s = D.warp, w = s.width, h = s.height, [c, x] = mk(w, h); x.drawImage(s, 0, 0);
    if (D.filter !== 'orig') { const im = x.getImageData(0, 0, w, h); filt(im.data, w, h, D.filter); x.putImageData(im, 0, 0); }
    D.out = c;
  }
  $('dAuto').addEventListener('click', () => { if (D.auto) { D.quad = D.auto.map(p => p.slice()); drawDoc(); } else toast('Kenarlar otomatik bulunamadı'); });
  $('dFull').addEventListener('click', () => { D.quad = [[0, 0], [D.w, 0], [D.w, D.h], [0, D.h]]; drawDoc(); });
  $('dCancel').addEventListener('click', closeDoc);
  $('dNext').addEventListener('click', async () => {
    showBusy('Düzeltiliyor…'); await sleep(30);
    D.warp = warpQuad(D.src, orderQuad(D.quad)); applyFilter(); D.stage = 'r'; docUI(); drawDoc(); hideBusy();
  });
  $('dBack').addEventListener('click', () => { D.stage = 'c'; docUI(); drawDoc(); });
  $('dRot').addEventListener('click', async () => { showBusy('Döndürülüyor…'); await sleep(20); D.warp = rot90(D.warp); applyFilter(); drawDoc(); hideBusy(); });
  $('chips').querySelectorAll('button').forEach(b => b.addEventListener('click', async () => {
    D.filter = b.dataset.f; docUI(); showBusy('Uygulanıyor…'); await sleep(20); applyFilter(); drawDoc(); hideBusy();
  }));
  $('dJpg').addEventListener('click', async () => {
    let blob = await toJpeg(D.out, 0.92); blob = await withExif(blob);
    setLast(blob, 'BELGE_' + stamp() + '.jpg', 'image/jpeg'); saveFile(); closeDoc(); toast('Belge kaydedildi');
  });
  $('dPdf').addEventListener('click', async () => {
    const blob = await toJpeg(D.out, 0.88);
    pages.push({ bytes: new Uint8Array(await blob.arrayBuffer()), w: D.out.width, h: D.out.height });
    updatePdfBar(); closeDoc(); toast('PDF\'e eklendi (' + pages.length + ' sayfa). Sonraki sayfayı çekin veya "PDF kaydet"e basın.', 3500);
  });
  function updatePdfBar() { $('pdfN').textContent = pages.length; $('pdfbar').style.display = (mode === 'doc' && pages.length) ? 'flex' : 'none'; }
  $('pdfSave').addEventListener('click', () => {
    if (!pages.length) return;
    setLast(makePdf(pages), 'BELGE_' + stamp() + '.pdf', 'application/pdf'); saveFile();
    toast('PDF kaydedildi (' + pages.length + ' sayfa)'); pages = []; updatePdfBar();
  });
  $('pdfClear').addEventListener('click', () => { pages = []; updatePdfBar(); toast('PDF sayfaları temizlendi'); });

  // ================= VİDEO =================
  function pickMime() {
    const list = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=h264', 'video/webm;codecs=vp9', 'video/webm'];
    return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }
  async function startRec() {
    let s = stream;
    try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); s = new MediaStream([...stream.getVideoTracks(), ...micStream.getAudioTracks()]); }
    catch (e) { toast('Mikrofon izni yok: ses kaydedilmeyecek'); micStream = null; }
    const mime = pickMime(), w = VRES[S.vres].w;
    const opts = { videoBitsPerSecond: w >= 3840 ? 40e6 : w >= 1920 ? 16e6 : 8e6 };
    if (mime) opts.mimeType = mime;
    chunks = []; recorder = new MediaRecorder(s, opts);
    recorder.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    recorder.onstop = () => {
      const type = recorder.mimeType || 'video/webm', blob = new Blob(chunks, { type }), ext = type.includes('mp4') ? 'mp4' : 'webm';
      setLast(blob, 'VID_' + stamp() + '.' + ext, type);
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      recorder = null; clearInterval(recTimer);
      $('rec').style.display = 'none'; $('shutter').classList.remove('recording');
      saveFile(); toast('Kaydedildi: İndirilenler/' + last.name, 3000);
    };
    recorder.start(1000); recStart = Date.now();
    $('rec').style.display = 'block'; $('shutter').classList.add('recording');
    recTimer = setInterval(() => { const sec = Math.floor((Date.now() - recStart) / 1000), p = n => String(n).padStart(2, '0'); $('rec').textContent = '● ' + p(Math.floor(sec / 60)) + ':' + p(sec % 60); }, 500);
  }

  // ================= SON ÇEKİM =================
  function setLast(blob, name, type) {
    if (last && last.url) URL.revokeObjectURL(last.url);
    last = { blob, name, type, url: URL.createObjectURL(blob) };
    const th = $('thumb');
    if (type.startsWith('image/')) { th.style.backgroundImage = 'url(' + last.url + ')'; th.textContent = ''; }
    else { th.style.backgroundImage = 'none'; th.textContent = type === 'application/pdf' ? '📄' : '▶'; }
  }
  function saveFile() { if (!last) return; const a = document.createElement('a'); a.href = last.url; a.download = last.name; document.body.appendChild(a); a.click(); a.remove(); }
  $('thumb').addEventListener('click', () => {
    if (!last) return;
    const m = $('pmedia'); m.innerHTML = ''; let el;
    if (last.type.startsWith('image/')) { el = document.createElement('img'); el.src = last.url; }
    else if (last.type.startsWith('video/')) { el = document.createElement('video'); el.src = last.url; el.controls = true; el.playsInline = true; }
    else { el = document.createElement('div'); el.style.fontSize = '18px'; el.textContent = '📄 ' + last.name; }
    el.style.maxWidth = '100%'; el.style.maxHeight = '60vh'; m.appendChild(el); $('panel').style.display = 'flex';
  });
  $('pClose').addEventListener('click', () => { $('panel').style.display = 'none'; $('pmedia').innerHTML = ''; });
  $('pSave').addEventListener('click', () => { saveFile(); toast('Kaydedildi'); });
  $('pShare').addEventListener('click', async () => {
    try {
      const f = new File([last.blob], last.name, { type: last.type });
      if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] });
      else toast('Paylaşma bu tarayıcıda desteklenmiyor; "Kaydet"i kullanın');
    } catch (e) {}
  });

  // ================= DEKLANŞÖR =================
  $('shutter').addEventListener('click', async () => {
    if (!track || busy || docOpen()) return;
    if (mode === 'video') { if (recorder) recorder.stop(); else await startRec(); return; }
    if (mode === 'scan') { lastCode = ''; $('scanCard').style.display = 'none'; toast('Yeniden taranıyor'); return; }
    busy = true;
    try {
      for (let i = timerSec; i > 0; i--) { showBusy(String(i)); vibrate(20); await sleep(1000); }
      await waitSteady(2500);
      hideBusy(); $('view').style.opacity = .4; setTimeout(() => $('view').style.opacity = 1, 120); vibrate(25);
      if (mode === 'night') await finishPhoto(await nightShot(), 'GECE');
      else if (mode === 'doc') { const r = await takeBest(Math.min(S.burst, 3)); hideBusy(); await openDoc(r); }
      else await finishPhoto(await takeBest(S.burst), 'IMG');
    } catch (e) { toast('Çekilemedi: ' + ((e && (e.message || e.name)) || e)); }
    hideBusy(); busy = false;
  });

  // ================= MODLAR =================
  MODES.forEach(([k, t]) => { const s = document.createElement('span'); s.dataset.m = k; s.textContent = t; if (k === mode) s.className = 'sel'; s.addEventListener('click', () => setMode(k)); $('modes').appendChild(s); });
  async function setMode(m) {
    if (recorder || busy || (m === mode && track)) return;
    if (mode === 'scan') stopScan();
    mode = m;
    document.querySelectorAll('#modes span').forEach(s => s.classList.toggle('sel', s.dataset.m === m));
    $('shutter').className = m === 'video' ? 'video' : m === 'scan' ? 'scan' : '';
    docLive = null; updatePdfBar(); applyOpt('*');
    try { await openCamera(); } catch (e) { toast('Kamera açılamadı: ' + e.name); }
    if (m === 'scan') startScan();
    if (m === 'doc') toast('Belgeyi kadraja alın; yeşil çerçeve kenarları gösterir', 2500);
    if (m === 'night') toast('Gece modu: çekim sırasında telefonu sabit tutun', 2500);
  }

  // ================= AYAR PANELİ =================
  const SW = [
    ['steady', 'Titreme kontrollü deklanşör', 'Telefon durgunlaşınca çeker (jiroskop)'],
    ['afLock', 'Dokununca odağı kilitle', 'Odak kendiliğinden kaymaz; açmak için "AF kilitli" rozetine dokunun'],
    ['refocus', 'Çekmeden önce yeniden odakla', 'Kapalı önerilir; açıkken her çekimde odak arar'],
    ['level', 'Ufuk çizgisi / su terazisi', 'Belge modunda telefon yatayken terazi çıkar'],
    ['grid', 'Izgara', ''],
    ['hist', 'Histogram', 'Kırmızı: aşırı parlak, mavi: aşırı karanlık'],
    ['zebra', 'Zebra çizgileri', 'Aşırı parlak (patlayan) yerleri gösterir'],
    ['thermal', 'Termal görünüm efekti', 'Gerçek sıcaklık ölçmez; parlaklığı ısı renklerine çevirir'],
    ['voice', 'Sesle çek (alkış)', 'Mikrofonu dinler, ses kaydetmez'],
    ['geo', 'Fotoğrafa konum ekle', 'GPS ve pusula yönü yalnızca dosyanın içine yazılır']
  ];
  const SEL = [
    ['burst', 'En net kare seçimi', [[1, 'Kapalı (1 kare)'], [3, '3 kare'], [5, '5 kare'], [8, '8 kare']]],
    ['photoQ', 'Fotoğraf çözünürlüğü', [[0, 'Varsayılan'], [1, 'Maksimum'], [2, '~12 MP']]],
    ['vres', 'Video çözünürlüğü', [[0, '720p'], [1, '1080p'], [2, '4K']]]
  ];
  function buildSheet() {
    const s = $('sheetBody'); s.innerHTML = '';
    SW.forEach(([k, t, sub]) => {
      const row = document.createElement('div'); row.className = 'row';
      const L = document.createElement('div'); L.textContent = t;
      if (sub) { const sm = document.createElement('small'); sm.textContent = sub; L.appendChild(sm); }
      const lab = document.createElement('label'); lab.className = 'sw';
      const inp = document.createElement('input'); inp.type = 'checkbox'; inp.dataset.k = k; inp.checked = !!S[k];
      inp.addEventListener('change', () => setOpt(k, inp.checked));
      lab.append(inp, document.createElement('i')); row.append(L, lab); s.appendChild(row);
    });
    SEL.forEach(([k, t, opts]) => {
      const row = document.createElement('div'); row.className = 'row';
      const L = document.createElement('div'); L.textContent = t;
      const sel = document.createElement('select'); sel.dataset.k = k;
      opts.forEach(([v, n]) => { const o = document.createElement('option'); o.value = v; o.textContent = n; sel.appendChild(o); });
      sel.value = S[k]; sel.addEventListener('change', () => setOpt(k, +sel.value));
      row.append(L, sel); s.appendChild(row);
    });
  }
  function syncSheet() { $('sheetBody').querySelectorAll('[data-k]').forEach(e => { if (e.type === 'checkbox') e.checked = !!S[e.dataset.k]; else e.value = S[e.dataset.k]; }); }
  function setOpt(k, v) { S[k] = v; saveS(); applyOpt(k); }
  function applyOpt(k) {
    const all = k === '*';
    if (all || k === 'grid') $('grid').style.display = S.grid ? 'block' : 'none';
    if (all || k === 'hist') $('hist').style.display = S.hist && mode !== 'scan' && mode !== 'video' ? 'block' : 'none';
    if (all || k === 'thermal') $('thermalTag').style.display = S.thermal && ['photo', 'pro', 'night'].includes(mode) ? 'block' : 'none';
    if (k === 'voice') { if (S.voice) { voiceOn(); toast('Sesle çekim açık: alkışlayın'); } else voiceOff(); }
    if (k === 'geo') { if (S.geo) { geoOn(); toast('Konum alınıyor…'); } else geoOff(); }
    if (k === 'vres' && mode === 'video') openCamera().catch(() => {});
  }
  const openSheet = o => { $('sheet').style.display = o ? 'block' : 'none'; $('sheetBack').style.display = o ? 'block' : 'none'; };
  $('bSet').addEventListener('click', () => openSheet(true));
  $('sheetClose').addEventListener('click', () => openSheet(false));
  $('sheetBack').addEventListener('click', () => openSheet(false));
  buildSheet();

  // ================= BAŞLAT =================
  $('go').addEventListener('click', async () => {
    $('err').textContent = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('err').textContent = 'Bu tarayıcı kamera erişimini desteklemiyor. Sayfayı Chrome ile açın.'; return; }
    try {
      await openCamera();
      $('start').style.display = 'none';
      applyOpt('*');
      if (S.voice) voiceOn();
      if (S.geo) geoOn();
      if (!loopOn) { loopOn = true; requestAnimationFrame(overlay); }
    } catch (e) {
      let msg = 'Kamera açılamadı (' + (e && e.name) + ').';
      if (!window.isSecureContext || location.protocol === 'content:') msg += '\n\nSayfa güvenli olmayan bir adresten açılmış (' + location.protocol + '). Uygulamayı GitHub adresinden açın.';
      else msg += '\nChrome menüsü → Ayarlar → Site ayarları → Kamera bölümünden izni kontrol edin.';
      $('err').textContent = msg;
    }
  });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (!recorder) stopStream(); voiceOff(); }
    else if (started()) { openCamera().then(() => { if (mode === 'scan') startScan(); }).catch(() => {}); if (S.voice) voiceOn(); }
  });

  if (/[?&]test\b/.test(location.search)) window.__kameraTest = { detectDoc, warpQuad, makePdf, buildExif, withExif, filt, toGray, mk, S, M, orderQuad, lapVar };
})();
</script>
